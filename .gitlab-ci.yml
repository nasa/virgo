test:
  only:
    - merge_requests
  script:
    - "apt-get update && apt-get install -y python3.11 python3.11-venv python3-pip "
    - "apt-get install -y libgl1-mesa-glx libosmesa6 libglu1-mesa curl"
    - "curl -LsSf https://astral.sh/uv/install.sh | sh"
    - "source $HOME/.local/bin/env"
    - "uv sync --extra all"
    - "export VTK_DEFAULT_RENDER_WINDOW_OFFSCREEN=1 && cd tests/ && uv run ./test.py"


