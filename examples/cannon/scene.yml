name: VIRGO Cannon Example
description: |
    This scene visualizes a cannonball being shot from a cannon at a 70
    degree angle. The forces acting on the ball are shown using VIRGO
    vectors, demonstrating the two modes: unit and absolute for displaying
    a vector in a VIRGO scene. Be sure to use the arrow keys to inspect
    the bounce force on the ball at the exact frames the ball hits the
    ground. Note that the physics of this scene are generated by AI 
    written code in cannon.py.
resolution: 1280x720
background_color: [0.0, 0.0, 0.05]   # Background color of the scene
highlight_color: [1.0, 1.0, 0.0]     # RGB Highlight color when objects are picked
start_mode: PAUSED                   # Start the scene paused
end_mode: PAUSED                     # End the scene paused
playback_speed: 1.0                  # Default playback speed 1.0X realtime
playback_speeds: [1.0, 2.0, 5.0]     # Available playback speeds
# This section defines the data VIRGO consumes to drive actors in the scene
data_source:
  trickpy:  # The log_pendulum.csv data file is in TrickPy-compatible format
    # The time alias definition for the pendulum logging group. This maps
    # the 1st column of log_pendulum.csv to a VIRGO data alias named 'sim_time'
    sim_time:
      group: cannonball
      var: time
    ball_pos:
      group: cannonball
      var: pos[0-2]
    ball_vel:
      group: cannonball
      var: vel[0-2]
    force_cannon:
      group: cannonball
      var: F_cannon[0-2]
    force_drag:
      group: cannonball
      var: F_drag[0-2]
    force_bounce:
      group: cannonball
      var: F_bounce[0-2]
    force_gravity:
      group: cannonball
      var: F_gravity[0-2]

frames:
  # Frame where X-dir points along the cannon shaft
  cannon_x_direction:
    ypr: [0, -70, 0]

actors:
  floor:
    mesh: VIRGO_PREFAB:cube
    scale: 1000
    pos: [450, 0, -500]
    color: [0.5, 0.25, 0.0]
    axes: 
      when: never  # always, never, picked, or toggled
      style: line  # cylinder, line
  # TODO: cannon_base and cannon_shaft are hacked together with
  # the limited ability to make primitives we have in Jan 2026.
  # we should consider making this example a bit more polished
  # with a real cannon mesh and frames defined robustly
  cannon_base:
    mesh: VIRGO_PREFAB:cube
    color: [0.133, 0.408, 0.173]
    opacity: 0.5
    scale: 2.5
    pos: [0, 0, 0.5]
    ypr: [0, 0, 0]
  cannon_shaft:
    mesh: VIRGO_PREFAB:cylinder
    color: [0.133, 0.408, 0.173]
    pos: [2.0, 0, 0.0]
    scale: 2.0
    opacity: 0.5
    ypr: [90, 0, 0]
    parent: cannon_x_direction
  ball:
    mesh: VIRGO_PREFAB:sphere
    color: [1.0, 0.0, 0.0]
    axes: 
      style: line        # cylinder, line
    scale: 0.2  # 0.1 is actual size, oversized for visiblity
    trail:
      enabled: 1
      color: [1.0, 0, 0]
      thickness: 3
      opacity: 0.5
    labels:
      name:
        scale: 0.5
        color: [1.0, 1.0, 1.0]
        text: |
          Velocity (m/s):
            x: {ball_vel[0]@sim_time:<10.2f}
            y: {ball_vel[1]@sim_time:<10.2f}
            z: {ball_vel[2]@sim_time:<10.2f}
        pos: [0.0, 0.0, 8.0]
        when: toggled
        faces_camera: 1
    driven_by:  # Defines how this actor is driven in the scene
      time: sim_time  
      pos: ball_pos 

vectors:
  f_drag:
    # Show this vector's actual size using 'absolute' mode
    mode: absolute
    # Static scale to apply to this vector's size. This let's the
    # user control how big the vector appears if 'absolute' with
    # the default 1.0 scale is too large or small to be useful
    scale: 0.2
    driven_by:  # Defines how this actor is driven in the scene
      time: sim_time  
      pos: force_drag 
    parent: ball
    axes: 
      style: line        # cylinder, line
    color: [0.0, 1.0, 1.0]
    labels:
      drag_force:
        scale: 0.2
        color: [0.0, 1.0, 1.0]
        text: |
          F_drag (N):
            x: {force_drag[0]@sim_time:<10.2f}
            y: {force_drag[1]@sim_time:<10.2f}
            z: {force_drag[2]@sim_time:<10.2f}
        pos: [-2.0, 0.0, 1.5]
        when: always
        faces_camera: 1
  f_gravity:
    color: [0.0, 1.0, 0.0]
    driven_by:  # Defines how this actor is driven in the scene
      time: sim_time  
      pos: force_gravity 
    parent: ball
    axes: 
      style: line        # cylinder, line
    labels:
      grav_force:
        scale: 0.2
        color: [0.0, 1.0, 0.0]
        text: |
          F_gravity (N):
            x: {force_gravity[0]@sim_time:<10.2f}
            y: {force_gravity[1]@sim_time:<10.2f}
            z: {force_gravity[2]@sim_time:<10.2f}
        pos: [0.0, 0.0, -0.5]
        when: always
        faces_camera: 1
  f_bounce:
    color: [1.0, 1.0, 0.0]
    driven_by:  # Defines how this actor is driven in the scene
      time: sim_time  
      pos: force_bounce 
    parent: ball
    axes: 
      style: line
    labels:
      bounce_force:
        scale: 0.2
        color: [1.0, 1.0, 0.0]
        text: |
          F_bounce (N):
            x: {force_bounce[0]@sim_time:<10.2f}
            y: {force_bounce[1]@sim_time:<10.2f}
            z: {force_bounce[2]@sim_time:<10.2f}
        pos: [0.0, 0.0, 3.5]
        when: always
        faces_camera: 1
  f_cannon:
    driven_by:  # Defines how this actor is driven in the scene
      time: sim_time  
      pos: force_cannon 
    parent: cannon_base
    scale: 1.5 
    axes: 
      style: line        # cylinder, line
    color: [1.0, 0.0, 1.0]
    labels:
      cannon_force:
        scale: 0.2
        color: [1.0, 0.0, 1.0]
        text: |
          F_cannon (N):
            x: {force_cannon[0]@sim_time:<10.2f}
            y: {force_cannon[1]@sim_time:<10.2f}
            z: {force_cannon[2]@sim_time:<10.2f}
        pos: [2.0, 0.0, 1.0]
        when: always
        faces_camera: 1
lighting:
    start_mode: ultrabright
camera:
    position: [30.5, -10.0, 10.0]
    focal_point: [0.0, 0.0, 0.0]
    view_up: [0.0, 0.0, 1.0]
    follow: ball